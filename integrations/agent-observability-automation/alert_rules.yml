groups:
  - name: agent_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(agent_requests_total{status="error"}[5m]) / rate(agent_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI Agent 错误率超过 5%"
          description: "错误率: {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(agent_request_duration_seconds_bucket[5m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Agent P99 延迟超过 3 秒"
          description: "P99: {{ $value | humanizeDuration }}"

      - alert: HighTokenCost
        expr: increase(agent_tokens_total[24h]) * 0.00001 > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Agent 日 Token 消耗超过 $10"

      - alert: AgentDown
        expr: up{job="ai-agent"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Agent 服务不可用"
          description: "Agent 已离线超过 1 分钟"
